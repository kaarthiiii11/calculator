<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<style>

body{
    margin:0;
    padding:0;
    background:#f2f2f2;
    font-family:Arial, Helvetica, sans-serif;
}

.calculator{

    width:340px;

    background:#000;

    padding:20px;

    border-radius:30px;

    box-shadow:0px 10px 30px rgba(0,0,0,0.35);

}

.display-area{

    margin-bottom:20px;

}

.display{

    height:90px;

    background:#1e1e1e;

    color:#f6f6f6;

    border:none;

    font-size:45px;

    text-align:right;

    border-radius:20px;

    padding-right:20px;

}

.display:focus{

    background:#000;

    color:#fff;

    box-shadow:none;

    border:none;

}

.display::placeholder{

    color:#fff;

}

.btn{

    height:65px;

    width:65px;

    border-radius:50%;

    border:none;

    font-size:24px;

    font-weight:bold;

    transition:0.3s;

}

.btn:hover{

    transform:scale(0.95);

}

.btn-number{

    background:#333333;

    color:#ffffff;

}

.btn-number:hover{

    background:#4a4a4a;

    color:#ffffff;

}

.btn-function{

    background:#a5a5a5;

    color:#000000;

}

.btn-function:hover{

    background:#bdbdbd;

    color:#000000;

}

.btn-operator{

    background:#ff9500;

    color:#ffffff;

}

.btn-operator:hover{

    background:#ffad33;

    color:#ffffff;

}

.btn-equal{

    background:#ff9500;

    color:#ffffff;

}

.btn-equal:hover{

    background:#ffad33;

    color:#ffffff;

}

.row{

    justify-content:center;

}

.col-6 .btn{

    width:100%;

    border-radius:35px;

}

</style>

<body>

<div class="container d-flex justify-content-center align-items-center vh-100">

    <div class="calculator">

        <div class="display-area">

            <input
                type="text" id="result" class="form-control display" placeholder="0" readonly>

        </div>

        <div class="container-fluid p-0">

            <div class="row g-2 mb-2">

                <div class="col-3">
                    <button class="btn btn-function w-100" onclick="clearBox()"> AC </button>
                </div>

                <div class="col-3">
                    <button class="btn btn-function w-100" onclick="displayNumber('%')"> &#37; </button>
                </div>

                <div class="col-3">
                    <button class="btn btn-function w-100" onclick="removeLastItem()">&#9003; </button>
                </div>

                <div class="col-3">
                    <button class="btn btn-operator w-100" onclick="displayNumber('/')"> &#247; </button>
                </div>

            </div>

            <div class="row g-2 mb-2">

                <div class="col-3">
                    <button class="btn btn-number w-100" onclick="displayNumber(7)"> 7 </button>
                </div>

                <div class="col-3">
                    <button class="btn btn-number w-100" onclick="displayNumber(8)"> 8 </button>
                </div>

                <div class="col-3">
                    <button class="btn btn-number w-100" onclick="displayNumber(9)"> 9 </button>
                </div>

                <div class="col-3">
                    <button class="btn btn-operator w-100" onclick="displayNumber('*')"> &#215; </button>
                </div>

            </div>

            <div class="row g-2 mb-2">

                <div class="col-3">
                    <button class="btn btn-number w-100" onclick="displayNumber(4)"> 4 </button>
                </div>

                <div class="col-3">
                    <button class="btn btn-number w-100" onclick="displayNumber(5)"> 5 </button>
                </div>

                <div class="col-3">
                    <button class="btn btn-number w-100"  onclick="displayNumber(6)"> 6 </button>
                </div>

                <div class="col-3">
                    <button class="btn btn-operator w-100" onclick="displayNumber('-')"> &#8722; </button>
                </div>

            </div>

            <div class="row g-2 mb-2">

                <div class="col-3">
                    <button class="btn btn-number w-100" onclick="displayNumber(1)"> 1 </button>
                </div>

                <div class="col-3">
                    <button class="btn btn-number w-100" onclick="displayNumber(2)">  2 </button>
                </div>

                <div class="col-3">
                    <button class="btn btn-number w-100" onclick="displayNumber(3)"> 3  </button>
                </div>

                <div class="col-3">
                    <button class="btn btn-operator w-100"  onclick="displayNumber('+')">  &#43; </button>
                </div>

            </div>

            <div class="row g-2">

                <div class="col-3">
                    <button class="btn btn-number w-100"  onclick="displayNumber(0)"> 0 </button>
                </div>

                <div class="col-3">
                    <button class="btn btn-number w-100" onclick="displayNumber('.')"> . </button>
                </div>

                <div class="col-6">
                    <button class="btn btn-equal w-100" onclick="evaluateExp()"> &#61; </button>
                </div>

            </div>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
